<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoho Inventory Search</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
*{box-sizing:border-box}
body{margin:0}
.page{width:min(1380px,calc(100% - 32px));margin:28px auto 60px}
h1{margin:0 0 6px;font-size:30px}
.subtitle{margin:0 0 22px;color:#667085}
.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;box-shadow:0 8px 24px rgba(16,24,40,.05);overflow:hidden}
.toolbar{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;padding:16px;border-bottom:1px solid #eaecf0}
input,select,button{font:inherit}
input,select{border:1px solid #d0d5dd;border-radius:9px;padding:11px 13px;background:#fff}
input:focus,select:focus{outline:0;border-color:#315efb;box-shadow:0 0 0 3px rgba(49,94,251,.1)}
button{border:0;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer}
.primary{background:#315efb;color:#fff}
.secondary{background:#eef2ff;color:#2948c7}
.ghost{background:#f2f4f7;color:#344054}
button:disabled{opacity:.5;cursor:not-allowed}
.status{padding:11px 16px;color:#667085;font-size:14px;border-bottom:1px solid #eaecf0}
.status.error{color:#b42318}
.status.warning{color:#9a6700;background:#fffaeb}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 14px;border-bottom:1px solid #eaecf0;text-align:left;white-space:nowrap}
th{font-size:12px;text-transform:uppercase;color:#667085;background:#fcfcfd}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f8faff}
.name{white-space:normal;min-width:290px;font-weight:650}
.sku{font-family:ui-monospace,Consolas,monospace;color:#2948c7;font-weight:700}
.empty{text-align:center;padding:42px;color:#667085}
.pagination{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.actions{display:flex;gap:8px}
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.38);display:none;justify-content:flex-end;z-index:10}
.overlay.open{display:flex}
.drawer{width:min(720px,96vw);height:100%;background:#fff;display:flex;flex-direction:column;box-shadow:-12px 0 30px rgba(16,24,40,.15)}
.drawer-head{display:flex;justify-content:space-between;gap:16px;padding:18px 20px;border-bottom:1px solid #eaecf0}
.drawer-head h2{margin:0 0 5px}
.drawer-head p{margin:0;color:#667085}
.close{width:36px;height:36px;padding:0;font-size:20px}
.tabs{display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid #eaecf0;background:#fcfcfd}
.tab-btn{background:#f2f4f7;color:#344054;padding:8px 12px}
.tab-btn.active{background:#315efb;color:#fff}
.drawer-body{padding:18px 20px 32px;overflow:auto}
.raw-panel{display:none;padding:18px 20px 32px;overflow:auto;flex:1;background:#101828}
.raw-panel.active{display:block}
.drawer-body.hidden{display:none}
.raw-json{margin:0;color:#d0d5dd;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.section{font-size:13px;text-transform:uppercase;color:#475467;margin:20px 0 8px}
.section:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:190px 1fr;border-top:1px solid #eaecf0}
.label,.val{padding:9px 8px;border-bottom:1px solid #eaecf0;overflow-wrap:anywhere}
.label{color:#667085;font-weight:600}
.desc{white-space:pre-wrap;line-height:1.5}
@media(max-width:820px){.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}}
@media(max-width:560px){.toolbar{grid-template-columns:1fr}.toolbar input{grid-column:auto}.grid{grid-template-columns:1fr}.label{border-bottom:0;padding-bottom:2px}.val{padding-top:2px}}
</style>
</head>
<body>
<main class="page">
<h1>Zoho Inventory Search</h1>
<p class="subtitle">Search for matching items, then click the exact result whose full SKU details you want to inspect.</p>

<section class="panel">
<div class="toolbar">
<input id="searchInput" type="search" placeholder="SKU, item name, brand, MPN..." autocomplete="off">
<button id="searchBtn" class="primary" type="button">Search</button>
<button id="exactBtn" class="secondary" type="button">Exact SKU</button>
<select id="pageSize">
<option value="25">25 / page</option>
<option value="50" selected>50 / page</option>
<option value="100">100 / page</option>
<option value="200">200 / page</option>
</select>
</div>

<div id="status" class="status">Loading items…</div>

<div class="table-wrap">
<table>
<thead><tr>
<th>SKU</th><th>Item name</th><th>Brand</th><th>MPN</th>
<th>Condition</th><th>Stock</th><th>Available</th><th>Updated</th>
</tr></thead>
<tbody id="rows"></tbody>
</table>
<div id="empty" class="empty" hidden>No matching items found.</div>
</div>

<div class="pagination">
<div id="pageInfo">Page 1</div>
<div class="actions">
<button id="clearBtn" class="ghost" type="button">Clear search</button>
<button id="prevBtn" class="ghost" type="button">Previous</button>
<button id="nextBtn" class="ghost" type="button">Next</button>
</div>
</div>
</section>
</main>

<div id="overlay" class="overlay">
<aside class="drawer">
<div class="drawer-head">
<div><h2 id="title">Item details</h2><p id="skuLine"></p></div>
<button id="closeBtn" class="ghost close">×</button>
</div>

<div class="tabs">
<button id="detailsTabBtn" class="tab-btn active" type="button">Details</button>
<button id="rawTabBtn" class="tab-btn" type="button">Raw Response</button>
</div>

<div id="drawerBody" class="drawer-body"></div>
<div id="rawPanel" class="raw-panel">
<pre id="rawJson" class="raw-json"></pre>
</div>
</aside>
</div>

<script>
const state={page:1,perPage:50,query:"",items:[],pagination:{}};
const $=id=>document.getElementById(id);
const rows=$("rows"),statusEl=$("status"),empty=$("empty");
const searchInput=$("searchInput"),searchBtn=$("searchBtn"),exactBtn=$("exactBtn"),pageSize=$("pageSize");
const prevBtn=$("prevBtn"),nextBtn=$("nextBtn"),clearBtn=$("clearBtn"),pageInfo=$("pageInfo");
const overlay=$("overlay"),drawerBody=$("drawerBody"),title=$("title"),skuLine=$("skuLine"),closeBtn=$("closeBtn");
const detailsTabBtn=$("detailsTabBtn"),rawTabBtn=$("rawTabBtn"),rawPanel=$("rawPanel"),rawJson=$("rawJson");

function pick(o,...keys){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=="")return o[k]}return null}
function txt(v){return v===null||v===undefined||v===""?"—":String(v)}

function renderRows(){
  rows.innerHTML="";
  empty.hidden=state.items.length>0;

  for(const item of state.items){
    const tr=document.createElement("tr");
    const vals=[
      pick(item,"sku"),pick(item,"item_name","name"),pick(item,"brand"),
      pick(item,"mpn","part_number"),pick(item,"condition"),pick(item,"stock_on_hand"),
      pick(item,"available_stock","available_for_sale_stock"),
      pick(item,"last_updated","zoho_updated_at")
    ];

    vals.forEach((v,i)=>{
      const td=document.createElement("td");
      td.textContent=txt(v);
      if(i===0)td.className="sku";
      if(i===1)td.className="name";
      tr.appendChild(td);
    });

    const sku=pick(item,"sku");
    if(sku)tr.addEventListener("click",()=>openItem(String(sku)));
    rows.appendChild(tr);
  }
}

function updatePagination(){
  const p=state.pagination||{};
  const current=Number(p.page||state.page);
  let s=`Page ${current}`;
  if(p.total_pages)s+=` of ${p.total_pages}`;
  if(p.total!==undefined&&p.total!==null)s+=` • ${p.total} result${Number(p.total)===1?"":"s"}`;
  pageInfo.textContent=s;

  prevBtn.disabled=current<=1;
  nextBtn.disabled=p.has_more===false||state.items.length===0;
}

async function loadItems(){
  statusEl.className="status";
  statusEl.textContent=state.query?`Searching for "${state.query}"…`:"Loading Zoho items…";
  rows.innerHTML="";
  empty.hidden=true;

  try{
    const url=`/api/items?page=${state.page}&per_page=${state.perPage}&q=${encodeURIComponent(state.query)}`;
    const r=await fetch(url);
    const data=await r.json();

    if(!r.ok||!data.success)throw new Error(data.error||`HTTP ${r.status}`);

    state.items=Array.isArray(data.items)?data.items:[];
    state.pagination=data.pagination||{};
    renderRows();
    updatePagination();

    if(data.warning){
      statusEl.className="status warning";
      statusEl.textContent=data.warning;
    }else if(state.query){
      statusEl.textContent=`${state.items.length} matching item${state.items.length===1?"":"s"} loaded for "${state.query}". Click a row for full details.`;
    }else{
      statusEl.textContent=`${state.items.length} item${state.items.length===1?"":"s"} loaded. Search above or click any row.`;
    }
  }catch(e){
    state.items=[];
    renderRows();
    statusEl.className="status error";
    statusEl.textContent=e.message||"Search failed.";
  }
}

function addSection(name,entries){
  const valid=entries.filter(x=>x[1]!==null&&x[1]!==undefined&&x[1]!=="");
  if(!valid.length)return;

  const h=document.createElement("h3");
  h.className="section";
  h.textContent=name;

  const g=document.createElement("div");
  g.className="grid";

  for(const [label,val,type] of valid){
    const a=document.createElement("div");
    a.className="label";
    a.textContent=label;

    const b=document.createElement("div");
    b.className="val";
    if(type==="desc")b.classList.add("desc");

    if(type==="link"){
      const link=document.createElement("a");
      link.href=String(val);
      link.target="_blank";
      link.rel="noopener";
      link.textContent=String(val);
      b.appendChild(link);
    }else{
      b.textContent=txt(val);
    }

    g.append(a,b);
  }

  drawerBody.append(h,g);
}

function showDetailsTab(){
  detailsTabBtn.classList.add("active");
  rawTabBtn.classList.remove("active");
  drawerBody.classList.remove("hidden");
  rawPanel.classList.remove("active");
}

function showRawTab(){
  rawTabBtn.classList.add("active");
  detailsTabBtn.classList.remove("active");
  drawerBody.classList.add("hidden");
  rawPanel.classList.add("active");
}

detailsTabBtn.addEventListener("click",showDetailsTab);
rawTabBtn.addEventListener("click",showRawTab);

function renderDetails(item){
  drawerBody.innerHTML="";
  title.textContent=txt(pick(item,"item_name","name"));
  skuLine.textContent=`SKU ${txt(pick(item,"sku"))}`;

  addSection("Basic information",[
    ["SKU",pick(item,"sku")],["Item name",pick(item,"item_name","name")],
    ["Brand",pick(item,"brand")],["Manufacturer",pick(item,"manufacturer")],
    ["MPN",pick(item,"mpn")],["Condition",pick(item,"condition")],
    ["Status",pick(item,"status")],["Zoho item ID",pick(item,"zoho_item_id")]
  ]);

  addSection("Inventory",[
    ["Stock on hand",pick(item,"stock_on_hand")],
    ["Available stock",pick(item,"available_stock")],
    ["Available for sale",pick(item,"available_for_sale_stock")],
    ["Committed stock",pick(item,"committed_stock")],
    ["Reorder point",pick(item,"reorder_point")]
  ]);

  addSection("Pricing",[
    ["Sales rate",pick(item,"sales_rate")],
    ["Purchase rate",pick(item,"purchase_rate")],
    ["eBay USD",pick(item,"ebay_usd")]
  ]);

  addSection("Links",[
    ["eBay",pick(item,"ebay_link"),"link"],
    ["Blog",pick(item,"blog_link"),"link"]
  ]);

  addSection("Other",[
    ["Weight",pick(item,"weight_lbs")],
    ["Weight unit",pick(item,"weight_unit")],
    ["Last updated",pick(item,"last_updated","zoho_updated_at")],
    ["Description",pick(item,"description"),"desc"],
    ["Remarks",pick(item,"remarks"),"desc"]
  ]);
}

async function openItem(sku){
  overlay.classList.add("open");
  showDetailsTab();
  title.textContent="Loading…";
  skuLine.textContent=`SKU ${sku}`;
  drawerBody.innerHTML="";
  rawJson.textContent="Loading raw response…";

  try{
    const r=await fetch(`/api/item?sku=${encodeURIComponent(sku)}`);
    const data=await r.json();

    rawJson.textContent=JSON.stringify(data.raw ?? data, null, 2);

    if(!r.ok||!data.success)throw new Error(data.error||`HTTP ${r.status}`);
    renderDetails(data.item||{});
  }catch(e){
    title.textContent="Could not load item";
    drawerBody.textContent=e.message||"Unknown error";

    if(!rawJson.textContent || rawJson.textContent==="Loading raw response…"){
      rawJson.textContent=JSON.stringify({error:e.message||"Unknown error"}, null, 2);
    }
  }
}

function runSearch(){
  const q=searchInput.value.trim();
  if(!q){searchInput.focus();return}
  state.query=q;
  state.page=1;
  loadItems();
}

function runExactSku(){
  const sku=searchInput.value.trim();
  if(!sku){searchInput.focus();return}
  openItem(sku);
}

searchBtn.addEventListener("click",runSearch);
exactBtn.addEventListener("click",runExactSku);

searchInput.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    runSearch();
  }
});

clearBtn.addEventListener("click",()=>{
  searchInput.value="";
  state.query="";
  state.page=1;
  loadItems();
});

pageSize.addEventListener("change",()=>{
  state.perPage=Number(pageSize.value);
  state.page=1;
  loadItems();
});

prevBtn.addEventListener("click",()=>{
  if(state.page>1){
    state.page--;
    loadItems();
  }
});

nextBtn.addEventListener("click",()=>{
  state.page++;
  loadItems();
});

closeBtn.addEventListener("click",()=>overlay.classList.remove("open"));
overlay.addEventListener("click",e=>{if(e.target===overlay)overlay.classList.remove("open")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")overlay.classList.remove("open")});

loadItems();
</script>
</body>
</html>
